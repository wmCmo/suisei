<!doctype html>
<!--
  The icons. Same idea as src/card.html: draw at exact pixel sizes in a
  browser, where Zen Kaku Gothic New actually loads, and post the PNGs.

  To redraw them:  node scripts/render.mjs, then open this with ?save.
  Open it without ?save to look at them.

  Daylight rather than Nightside, because a tab strip is light by default and
  this is the mark people already see in the app's own bar.

  The glyph is drawn, not outlined, which is why these are PNGs and not one
  SVG: an SVG favicon cannot pull a web font, so a <text> element would render
  in whatever CJK face the machine happens to have, or in a tofu box on one
  that has none.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Suisei icons</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700&family=Noto+Sans+JP:wght@900&display=swap">
<style>
  html,body{margin:0;min-height:100%;background:#fbfaf8;color:#15181a;
    font-family:'Zen Kaku Gothic New',system-ui,sans-serif}
  body{display:flex;gap:40px;align-items:flex-end;padding:60px;flex-wrap:wrap}
  figure{margin:0;display:grid;gap:10px;justify-items:center}
  figcaption{font-size:13px;color:#5d6165}
  canvas{image-rendering:pixelated}
  .dark{background:#171c20;padding:20px;border-radius:12px}
</style>
</head>
<body>
<script>
/* Daylight, straight from tokens.css */
const ACCENT = '#1f4d52', ON_ACCENT = '#fbfaf8';
// the mark's own face — tokens.css calls this --mark
const MARK = "900 {size}px 'Noto Sans JP', 'Zen Kaku Gothic New', sans-serif";

function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y,     x + w, y + h, r);
  g.arcTo(x + w, y + h, x,     y + h, r);
  g.arcTo(x,     y + h, x,     y,     r);
  g.arcTo(x,     y,     x + w, y,     r);
  g.closePath();
}

/* square: iOS masks the apple-touch icon itself, so that one is full-bleed
   and anything rounded here would show as a dark ring inside Apple's mask */
function icon(size, square){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = ACCENT;
  if (square) g.fillRect(0, 0, size, size);
  else { roundRect(g, 0, 0, size, size, Math.round(size * 0.27)); g.fill(); }

  g.fillStyle = ON_ACCENT;
  g.font = MARK.replace('{size}', Math.round(size * 0.62));
  g.textAlign = 'center';
  g.textBaseline = 'alphabetic';
  /* Centre the ink, not the em box. A 'middle' baseline centres the font's
     line box, which for this face leaves 水 sitting high — measurably: 33px
     of air above and 44 below at 180. measureText reports where the glyph's
     own marks actually start and stop, so the baseline can be placed to put
     that box in the middle. */
  const m = g.measureText('水');
  const y = size / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
  g.fillText('水', size / 2, y);
  return c;
}

const WANTED = [
  // 16 is not shipped on its own: render.mjs folds it into favicon.ico
  ['favicon-16.png',       16,  false],
  ['favicon-32.png',       32,  false],
  ['apple-touch-icon.png', 180, true ],
];

(async () => {
  await document.fonts.load('900 120px "Noto Sans JP"', '水');
  await document.fonts.ready;

  const made = [];
  for (const [name, size, square] of WANTED){
    const c = icon(size, square);
    made.push([name, size, c]);
    const fig = document.createElement('figure');
    const shown = icon(size < 64 ? size * 4 : size, square);   // 32 is too small to judge
    fig.append(shown, Object.assign(document.createElement('figcaption'),
      {textContent: name + '  ' + size + 'px'}));
    document.body.append(fig);
  }
  // the tab-sized one against dark chrome too
  const dark = document.createElement('div');
  dark.className = 'dark';
  dark.append(icon(128, false));
  document.body.append(dark);

  if (new URLSearchParams(location.search).has('save')) {
    for (const [name, , c] of made){
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      await fetch('/__write/' + name, {method: 'POST', body: blob});
    }
    await fetch('/__done', {method: 'POST'});
    document.title = 'saved ' + made.length;
  }
})();
</script>
</body>
</html>
