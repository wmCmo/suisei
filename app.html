/* Decisions only. Every rule in this file declares custom properties and
   nothing else -- that is the test for whether a line belongs here. If a
   designer would change it, it is a token; if it describes how a widget is
   wired, it goes in app.css. The build refuses to ship a colour literal or
   a raw spacing value found outside this file. */
/* base:end */

/* Layout: a fixed 52px command bar over a single scrolling stage; the stage is
   either a card grid (home), a 680px writing column (build / fill), or a full
   width data surface (responses). Form canvases carry their own token set.

   Colour is Suisei's: mercury teal against warm stone, solar for anything
   live or unsaved. Surfaces are flat and edges are real — a control is
   defined by its hairline, never by a shadow pretending to be depth. */
:root{
  /* Daylight */
  --bg:#eae8e4; --surface:#fbfaf8; --sunk:#e2dfda;
  --line:#d8d4ce; --line-2:#b9b4ac; --line-strong:#86837d;
  --fg:#15181a; --muted:#5d6165; --faint:#7a7d81;
  --accent:#1f4d52; --accent-fg:#fbfaf8; --soft:#d8e3e2;
  --ok:#1f4d52; --warn:#a85b14; --warn-soft:#f0e4d2; --danger:#a33224;
  --ui:'Zen Kaku Gothic New','Noto Sans Thai','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
  --serif:'Zen Old Mincho','Noto Serif Thai','Hiragino Mincho ProN','Yu Mincho',Georgia,serif;
  --mono:ui-monospace,'Cascadia Mono','SFMono-Regular',Menlo,'Noto Sans Thai',monospace;
  --bar-h:52px;
  --r-sm:6px; --r:9px; --r-lg:14px; --r-pill:999px;
  --on-accent:#fbfaf8; --scrim:rgba(21,24,26,.34); --shadow-sm:0 1px 2px rgba(21,24,26,.08);
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px;
  --shadow:0 1px 2px rgba(21,24,26,.07),0 10px 26px -14px rgba(21,24,26,.26);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  /* Nightside */
  --bg:#171c20; --surface:#202830; --sunk:#12171b;
  --line:#2b343b; --line-2:#44505a; --line-strong:#64717a;
  --fg:#f2efea; --muted:#a9b2b8; --faint:#6c767c;
  --accent:#7fc3bd; --accent-fg:#0f1a1c; --soft:#24383c;
  --ok:#7fc3bd; --warn:#f0a35c; --warn-soft:#3a2a16; --danger:#f09287; --on-accent:#fbfaf8; --scrim:rgba(0,0,0,.5); --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.75);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#171c20; --surface:#202830; --sunk:#12171b;
  --line:#2b343b; --line-2:#44505a; --line-strong:#64717a;
  --fg:#f2efea; --muted:#a9b2b8; --faint:#6c767c;
  --accent:#7fc3bd; --accent-fg:#0f1a1c; --soft:#24383c;
  --ok:#7fc3bd; --warn:#f0a35c; --warn-soft:#3a2a16; --danger:#f09287; --on-accent:#fbfaf8; --scrim:rgba(0,0,0,.5); --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.75);
  color-scheme:dark;
}
/* A forced sheet also forces the UA's own widgets — scrollbars, selects,
   date pickers — so they don't arrive in the opposite theme. */
.canvasform[data-bg="light"]{--f-bg:#fbfaf8;--f-fg:#15181a;--f-line:#d8d4ce;--f-soft:#e2dfda;--f-muted:#5d6165;--f-wash:#d8e3e2;color-scheme:light}
.canvasform[data-bg="dark"]{--f-bg:#171c20;--f-fg:#f2efea;--f-line:#2b343b;--f-soft:#12171b;--f-muted:#a9b2b8;--f-wash:#24383c;color-scheme:dark}
/* The accent is picked by whoever built the form, so it can be a deep colour
   that disappears as text on a dark sheet. Fills keep the chosen colour;
   text and small marks take a lifted version of it. */
.canvasform[data-bg="dark"],
:root[data-theme="dark"] .canvasform[data-bg="auto"]{--f-accent-text:color-mix(in srgb,var(--f-accent) 48%,#f2efea)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .canvasform[data-bg="auto"]{--f-accent-text:color-mix(in srgb,var(--f-accent) 48%,#f2efea)}}

/* The form sheet carries its own set, so a form can be themed
   independently of the app around it. */
.canvasform{--f-bg:var(--surface);--f-fg:var(--fg);--f-line:var(--line);--f-soft:var(--sunk);--f-muted:var(--muted);--f-wash:var(--soft);--f-accent:#1f4d52;--f-accent-text:var(--f-accent);--f-r:9px;--f-font:var(--ui)}

   twenty sizes that were picked one rule at a time. Sizes only -- the
   family stays separate so a form can set its own. */
:root{
  --fs-display: 30px;  --lh-display: 38px;
  --fs-h1:      25px;  --lh-h1:      32px;
  --fs-h2:      19px;  --lh-h2:      26px;
  --fs-figure:  24px;  --lh-figure:  28px;
  --fs-ask:     16px;  --lh-ask:     24px;
  --fs-body:    15px;  --lh-body:    22px;
  --fs-label:   13px;  --lh-label:   18px;
  --fs-caption: 12px;  --lh-caption: 16px;
  --fs-micro:   11px;  --lh-micro:   16px;
}

<style>
/* base:start — supplied by the artifact host; scripts/for-artifact.mjs strips it */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

svg{display:block}
::selection{background:var(--soft)}

/* ---------- command bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:var(--sp-2);height:var(--bar-h);
  background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(var(--sp-3),env(safe-area-inset-left,0px));padding-right:max(var(--sp-3),env(safe-area-inset-right,0px))}

.mark i{display:grid;place-items:center;width:22px;height:22px;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-fg);font-style:normal;font-size:var(--fs-label);line-height:var(--lh-label);font-weight:700}

.crumb input:hover{border-color:var(--line)}

.seg{display:flex;gap:2px;background:var(--sunk);border-radius:var(--r);padding:var(--sp-1)}
.seg button{padding:var(--sp-1) var(--sp-3);border-radius:var(--r-sm);font-size:var(--fs-label);line-height:var(--lh-label);font-weight:500;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
.tools{display:flex;align-items:center;gap:var(--sp-1)}
.btn{display:inline-flex;align-items:center;gap:var(--sp-1);padding:var(--sp-1) var(--sp-3);border-radius:var(--r);font-size:var(--fs-label);line-height:var(--lh-label);font-weight:500;color:var(--muted);white-space:nowrap}

/* ---------- stage ---------- */
.stage{padding-bottom:var(--sp-8)}

   and the stage's would push a short form into a scroll it does not need */

.tpl{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-2)}
.tpl button{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);border:1px solid var(--line);border-radius:var(--r-pill);font-size:var(--fs-label);line-height:var(--lh-label);background:var(--surface)}
.tpl button:hover{border-color:var(--accent);color:var(--accent)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:var(--sp-6) var(--sp-5);text-align:center;color:var(--muted)}

.canvasform{background:var(--f-bg);color:var(--f-fg);font-family:var(--f-font)}

.col{max-width:680px;margin:0 auto;padding-left:max(var(--sp-4),env(safe-area-inset-left,0px));padding-right:max(var(--sp-4),env(safe-area-inset-right,0px));padding-block:var(--sp-7) var(--sp-8)}

const rowToSub = r => ({id:r.id, formId:r.form_id, createdAt:new Date(r.created_at).getTime(),
                        answers:r.answers||{}, hidden:r.hidden||{}});

const store = {
  sb, user:null, ready:false, downloads:null, editor:false, offline:!sb, hasPublished:null, saveState:'idle',
  // forms is the workspace: yours, and local-only drafts. visiting holds a form
  // fetched because someone is filling it — never listed, never persisted.
  forms:{}, visiting:{}, subs:[], remote:[], counts:{}, onSubs:null, onSubsId:null, lastError:null,
  readLocal(){ try{ return JSON.parse(localStorage.getItem(LS)||'{}') }catch(e){ return {} } },
  writeLocal(){ try{ localStorage.setItem(LS, JSON.stringify({forms:this.forms, subs:this.subs.filter(s=>s.local)})) }catch(e){} },

  async boot(){
    const cached = this.readLocal();
    if(cached.forms) this.forms = cached.forms;
    if(cached.subs) this.subs = cached.subs;
    render();
    if(!sb){ this.ready = true; render(); if(fromHash()) render(); return; }
    try{
      const {data} = await sb.auth.getSession();
      this.user = data && data.session ? data.session.user : null;
    }catch(e){ this.user = null; }
    this.editor = !!this.user;
    sb.auth.onAuthStateChange((_evt, session) => {
      this.user = session ? session.user : null;
      this.editor = !!this.user;
      this.loadForms(); this.loadCounts(); render();
    });
    this.ready = true;
    await this.loadForms();
    await this.pruneVisits();
    this.loadCounts();
    const wanted = readLink().token;
    if(wanted.startsWith('form-')) await this.loadForm(wanted.slice(5));
    render();
    if(fromHash()) render();
  },

  /* The workspace is yours alone: it asks only for forms you own. A form
     someone is filling is fetched one at a time by id instead, which is the
     only read a respondent ever needs. */
  async loadForms(){
    if(!sb || !this.user) return;
    // the published column arrives with a migration; until it is run the app
    // behaves as it did before rather than failing every read and write
    const cols = this.hasPublished === false ? 'id,doc,updated_at' : 'id,doc,updated_at,published';
    let {data, error} = await sb.from('forms').select(cols)
      .eq('owner', this.user.id).order('updated_at',{ascending:false});
    if(error && /published/.test(error.message||'')){
      this.hasPublished = false;
      ({data, error} = await sb.from('forms').select('id,doc,updated_at')
        .eq('owner', this.user.id).order('updated_at',{ascending:false}));
    } else if(!error && this.hasPublished === null){
      this.hasPublished = true;
    }
    if(error){ this.lastError = error.message; render(); return; }
    this.lastError = null;
    const seen = new Set();
    (data||[]).forEach(row => {
      const f = row.doc; if(!f || !f.id) return;
      seen.add(f.id);
      if('published' in row) f.published = !!row.published;
      if(f.id === state.formId && Date.now() < state.dirtyUntil) return;  // mid-edit
      this.forms[f.id] = f;
      delete this.visiting[f.id];          // yours: it belongs in the workspace
    });
    this.owned = seen;
    this.writeLocal();
  },

  async loadForm(id){
    if(!sb || !id || this.forms[id] || this.visiting[id]) return;
    const {data} = await sb.from('forms').select('doc').eq('id', id).limit(1);
    const doc = data && data[0] && data[0].doc;
    if(doc && doc.id){ this.visiting[doc.id] = doc; render(); }
    else { state.missing = id; render(); }        // unpublished, or gone
  },

  /* Filling a form used to leave it in the workspace: the same bucket held
     both, and one writeLocal persisted the visit. Anything the server will
     hand us that is not ours was a visit, so drop it; a form the server does
     not have at all is a local-only draft and stays. */
  async pruneVisits(){
    if(!sb) return;
    const owned = this.owned || new Set();
    const ids = Object.keys(this.forms).filter(id => !owned.has(id));
    if(!ids.length) return;
    const {data, error} = await sb.from('forms').select('id').in('id', ids);
    if(error || !data || !data.length) return;
    data.forEach(r => { delete this.forms[r.id]; delete this.counts[r.id]; });
    this.writeLocal(); render();
  },

  async loadCounts(){
    if(!sb || !this.user) return;
    const {data, error} = await sb.from('submissions').select('form_id');
    if(error) return;                                   // only the owner may read these
    const c = {};
    (data||[]).forEach(r => { c[r.form_id] = (c[r.form_id]||0) + 1; });
    this.counts = c; render();
  },

  saveLabel(){
    if(!sb || !this.user) return 'this device';
    return {saving:'Saving…', saved:'Saved', error:'Not saved'}[this.saveState] || 'Saved';
  },
  // repaint one element rather than re-rendering: a save indicator that caused
  // a full render on every keystroke would be its own bug
  paintSave(){
    const el = document.getElementById('savestate');
    if(!el) return;
    el.textContent = this.saveLabel();
    el.className = 'pill' + (this.saveState === 'error' ? ' bad' : '');
  },
  saveForm(f){
    if(this.visiting[f.id]) return;      // someone else's form: not ours to keep or save
    f.updatedAt = Date.now();
    this.forms[f.id] = f;
    this.writeLocal();
    if(sb && this.user){ this.saveState = 'saving'; this.paintSave(); }
    clearTimeout(this._t);
    this._t = setTimeout(async () => {
      if(!sb || !this.user) return;                     // signed out: this device only
      const doc = JSON.parse(JSON.stringify(f));
      const row = {id:f.id, owner:this.user.id, title:f.title||'Untitled form', doc};
      if(this.hasPublished !== false) row.published = !!f.published;
      let {error} = await sb.from('forms').upsert(row, {onConflict:'id'});
      if(error && /published/.test(error.message||'')){
        this.hasPublished = false;
        delete row.published;
        ({error} = await sb.from('forms').upsert(row, {onConflict:'id'}));
      }
      if(error){ this.lastError = error.message; this.saveState = 'error'; console.warn('save', error); this.paintSave(); render(); }
      else { this.saveState = 'saved'; this.paintSave(); if(this.lastError){ this.lastError = null; render(); } }
    }, 600);
  },

  async deleteForm(id){
    delete this.forms[id]; delete this.counts[id]; this.writeLocal();
    if(sb && this.user) await sb.from('forms').delete().eq('id', id);
  },

  async submit(rec){
    if(sb){
      const {error} = await sb.from('submissions')
        .insert({id:rec.id, form_id:rec.formId, answers:rec.answers, hidden:rec.hidden||{}});
      if(!error){ this.counts[rec.formId] = (this.counts[rec.formId]||0) + 1; this.bump(rec); return {ok:true}; }
      rec.local = true; this.subs.push(rec); this.writeLocal();
      return {ok:false, code:error.code, message:error.message};
    }
    rec.local = true; this.subs.push(rec); this.writeLocal();
    return {ok:true, offline:true};
  },

  bump(rec){ if(!this.remote.some(r=>r.id===rec.id)) this.remote.push(rec); },
  rowsFor(formId){
    const seen = new Set();
    return this.remote.concat(this.subs).filter(r => r.formId===formId && !seen.has(r.id) && seen.add(r.id));
  },
  async watchSubs(formId, cb){
    this.onSubs = cb; this.onSubsId = formId;
    cb(this.rowsFor(formId));
    if(!sb || !this.user) return;
    const {data, error} = await sb.from('submissions')
      .select('id,form_id,answers,hidden,created_at').eq('form_id', formId)
      .order('created_at',{ascending:false}).limit(500);
    if(error){ this.lastError = error.message; render(); return; }
    this.remote = (data||[]).map(rowToSub);
    if(this.onSubs && this.onSubsId===formId) this.onSubs(this.rowsFor(formId));
    render();
  },
  stopWatch(){ this.onSubs = null; },
  countFor(id){
    const n = this.counts[id];
    return (n === undefined ? 0 : n) + this.subs.filter(s => s.formId===id).length;
  },

  async signIn(){
    if(!sb) return {ok:false, message:'No Supabase project configured'};
    const {error} = await sb.auth.signInWithOAuth({provider:'google',
      options:{redirectTo: location.origin + location.pathname}});
    // on success the browser leaves for Google and comes back signed in
    return error ? {ok:false, message:error.message} : {ok:true};
  },
  async signOut(){ if(sb) await sb.auth.signOut(); this.counts = {}; this.remote = []; render(); },
};

/* ============================ app state ============================ */
const state = {view:'home', formId:null, sel:null, focus:null, menu:null, panel:null,
  dirtyUntil:0, page:0, step:0, hist:[], answers:{}, bad:{}, done:false, rows:null, confirmDel:null,
  hidden:{}, testHidden:{}, emojiQ:'', missing:null, runner:null};
// a form is either yours or one you are visiting; everything that resolves an
// id must go through here, or a respondent's link lands on an empty workspace
const formById = id => store.forms[id] || store.visiting[id];
const form = () => formById(state.formId);
const bar = document.getElementById('bar');
const stage = document.getElementById('stage');
const layer = document.getElementById('layer');

function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent = msg;
  layer.appendChild(t); setTimeout(()=>t.remove(), 2600);
}
function go(view, id){
  state.missing = null;
  if(id!==undefined && id!==state.formId){ state.testHidden = {}; state.runner = null; }
  state.view = view; if(id!==undefined) state.formId = id;
  state.sel = null; state.menu = null; state.panel = null; state.confirmDel = null;
  if(view==='fill'){ state.page=0; state.step=0; state.hist=[]; state.answers={}; state.bad={}; state.done=false; }
  if(view==='responses'){ state.rows = null; store.watchSubs(state.formId, rows=>{ state.rows = rows; if(state.view==='responses') render(); }); }
  else store.stopWatch();
  if(view==='fill' && state.formId){
    const want = 'form-' + state.formId;
    if(readLink().token !== want){
      if(STANDALONE) swapUrl('?form=' + state.formId); else location.hash = want;
    }
    state.hidden = hiddenValues(form());
  } else if(location.hash || location.search){
    if(!swapUrl(location.pathname) && location.hash) location.hash = '';
  }
  render();
}
function swapUrl(to){
  try{ if(history.replaceState){ history.replaceState(null, '', to); return true; } }catch(e){}
  return false;
}
function pagesOf(f){
  const out = [[]];
  f.blocks.forEach(b=>{ if(b.type==='page') out.push([]); else out[out.length-1].push(b); });
  return out.filter((p,i)=> p.length || i===0);
}
function themeVars(f){
  const t = f.theme;
  return `--f-accent:${t.accent};--f-r:${Math.min(Number(t.radius)||0,16)}px;--f-font:${FONTS[t.font]||FONTS.sans}`;
}

/* ---------- conditional logic ---------- */
const OPS = {
  pick:[['is','is'],['is_not','is not'],['empty','is empty'],['not_empty','is answered']],
  num:[['is','is'],['is_not','is not'],['gt','is more than'],['lt','is less than'],['empty','is empty'],['not_empty','is answered']],
  text:[['is','is'],['is_not','is not'],['contains','contains'],['empty','is empty'],['not_empty','is answered']],
};
const DOS = [['jump','jump to'],['show','show'],['hide','hide'],['submit','submit the form']];
function opKind(t){
  if(t==='choice'||t==='dropdown'||t==='checkboxes') return 'pick';
  if(t==='rating'||t==='scale'||t==='number') return 'num';
  return 'text';
}
function rules(f){ return f.logic || (f.logic = []); }
function fields(f){ return f.hidden || (f.hidden = []); }
const HIDDEN_PREFIX = 'hidden:';
function whenOf(r, f, answers){
  const w = String(r.when||'');
  if(w.startsWith(HIDDEN_PREFIX)) return {kind:'text', v:(state.hidden||{})[w.slice(HIDDEN_PREFIX.length)]};
  const b = f.blocks.find(x=>x.id===r.when);
  return b ? {kind:opKind(b.type), v:answers[b.id], b} : null;
}
function truthy(r, f, answers){
  const w = whenOf(r, f, answers); if(!w) return false;
  const v = w.v;
  const has = !(v===undefined || v===null || v==='' || (Array.isArray(v) && !v.length));
  if(r.op==='empty') return !has;
  if(r.op==='not_empty') return has;
  if(!has) return false;
  const kind = w.kind;
  if(kind==='pick'){
    const hit = Array.isArray(v) ? v.includes(r.value) : v===r.value;
    return r.op==='is_not' ? !hit : hit;
  }
  if(kind==='num'){
    const n = Number(v), m = Number(r.value);
    if(Number.isNaN(m)) return false;
    if(r.op==='gt') return n > m;
    if(r.op==='lt') return n < m;
    return r.op==='is_not' ? n !== m : n === m;
  }
  const s = String(v).toLowerCase(), q = String(r.value==null?'':r.value).toLowerCase();
  if(r.op==='contains') return s.includes(q);
  return r.op==='is_not' ? s !== q : s === q;
}
function visible(b, f, answers){
  const rs = rules(f).filter(r=>r.target===b.id && (r.do==='show' || r.do==='hide'));
  if(!rs.length) return true;
  if(rs.some(r=>r.do==='hide' && truthy(r,f,answers))) return false;
  const shows = rs.filter(r=>r.do==='show');
  return shows.length ? shows.some(r=>truthy(r,f,answers)) : true;
}
function jumpFrom(pageBlocks, f, answers){
  const ids = new Set(pageBlocks.map(b=>b.id));
  return rules(f).find(r=>(r.do==='jump'||r.do==='submit')
    && (ids.has(r.when) || String(r.when).startsWith(HIDDEN_PREFIX))
    && truthy(r,f,answers)) || null;
}

/* ---------- hidden fields ----------
   The artifact viewer hands the page a plain #anchor only — a real query
   string never arrives — so values ride in the fragment as ~key.value,
   restricted to the characters the host passes through. */
const SAFE = /[^A-Za-z0-9._~-]+/g;
const safe = s => String(s==null?'':s).trim().replace(/\s+/g,'-').replace(SAFE,'');
const fieldName = s => String(s||'').trim().replace(/\s+/g,'_').replace(SAFE,'').slice(0,40);
/* Hosted as a plain page (a repo, a static host) the whole URL arrives intact,
   so links are ordinary query strings. Inside the artifact viewer only the
   fragment survives, hence the ~name.value form. */
const STANDALONE = !(window.claude && window.claude.use);
function linkFor(f, values){
  const base = location.origin + location.pathname;
  if(STANDALONE){
    const q = new URLSearchParams();
    q.set('form', f.id);
    fields(f).forEach(h=>{ const v = (values||{})[h.name]; if(v) q.set(h.name, String(v).trim()); });
    return base + '?' + q.toString();
  }
  return base + '#form-' + f.id + fields(f).map(h=>{
    const v = safe((values||{})[h.name]);
    return v ? '~' + h.name + '.' + v : '';
  }).join('');
}
function readLink(){
  const out = {token:'', values:{}};
  const parts = (location.hash||'').replace(/^#/,'').split('~');
  out.token = parts[0];
  parts.slice(1).forEach(p=>{
    const i = p.indexOf('.');
    if(i > 0) out.values[p.slice(0,i)] = p.slice(i+1);
  });
  try{
    const q = new URLSearchParams(location.search);
    const qf = q.get('form');
    if(qf && !out.token) out.token = 'form-' + qf;
    q.forEach((v,k)=>{ if(k!=='form' && !(k in out.values)) out.values[k] = v; });
  }catch(e){}
  return out;
}
function hiddenValues(f){
  const link = readLink();
  const out = {};
  fields(f).forEach(h=>{
    const v = (state.testHidden||{})[h.name] != null && (state.testHidden||{})[h.name] !== ''
      ? state.testHidden[h.name] : link.values[h.name];
    if(v !== undefined && v !== '') out[h.name] = String(v);
  });
  return out;
}
function pageOfBlock(f, id){
  let p = 0;
  for(const b of f.blocks){ if(b.type==='page'){ p++; continue; } if(b.id===id) return p; }
  return p;
}
function liveBlocks(pageBlocks, f){ return pageBlocks.filter(b=>visible(b,f,state.answers)); }

/* ---------- answer piping ----------
   A question gets a short, stable ref the first time it is referenced, so
   renaming the question later does not break the reference. "@name" in any
   later label is replaced by that answer while the form is being filled. */
const slug = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,24);
function ensureRef(b, f){
  if(b.ref) return b.ref;
  const base = slug(b.label) || b.type.replace(/_/g,'');
  const taken = new Set(f.blocks.filter(x=>x.ref).map(x=>x.ref));
  let r = base, n = 2;
  while(taken.has(r)) r = base + (n++);
  b.ref = r;
  return r;
}
function pipe(text, f){
  if(!text || String(text).indexOf('@') < 0) return text || '';
  return String(text).replace(/@([a-z0-9_]+)/gi, (whole, ref) => {
    const b = (f.blocks||[]).find(x => x.ref === ref);
    if(!b) return whole;                       // not a reference; leave it alone
    const v = state.answers[b.id];
    if(v===undefined || v===null || v==='' || (Array.isArray(v) && !v.length)) return '';
    return cellText(b, {answers: state.answers});
  }).replace(/[ 	]{2,}/g,' ').trim();
}

/* ---------- the one-question runner ----------
   Both runners read the same block list. Layout blocks ride along with the
   question that follows them, so a heading never gets a screen of its own. */
function stepsOf(f){
  const out = []; let lead = [];
  f.blocks.forEach(b => {
    if(b.type === 'page') return;
    if(!visible(b, f, state.answers)) return;
    if(isInput(b.type)){ out.push({lead, q:b}); lead = []; }
    else lead.push(b);
  });
  if(lead.length) out.push({lead, q:null});
  return out.length ? out : [{lead:[], q:null}];
}
function stepForPage(f, steps, page){
  const i = steps.findIndex(s => s.q && pageOfBlock(f, s.q.id) === page);
  return i < 0 ? steps.length - 1 : i;
}
function validateOne(b){
  state.bad = {};
  if(!b || !b.required) return true;
  const v = state.answers[b.id];
  const empty = v===undefined || v===null || v==='' || (Array.isArray(v) && !v.length);
  if(empty) state.bad[b.id] = 'This question needs an answer.';
  else if(b.type==='email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) state.bad[b.id] = 'Check the email address.';
  return !state.bad[b.id];
}
function advanceStep(){
  const f = form(), steps = stepsOf(f);
  const cur = steps[Math.min(state.step, steps.length-1)];
  if(cur.q && !validateOne(cur.q)){ render(); return; }
  const here = cur.q ? cur.q.id : null;
  const r = rules(f).find(x => (x.do==='jump' || x.do==='submit')
    && (x.when === here || String(x.when).startsWith(HIDDEN_PREFIX))
    && truthy(x, f, state.answers));
  if(r && r.do === 'submit'){ send(); return; }
  // "jump to page 3" in this runner means its first question
  let next = r ? stepForPage(f, steps, Number(r.page)||0) : state.step + 1;
  if(r && next === state.step) next = state.step + 1;
  if(next > steps.length - 1){ send(); return; }
  state.hist.push(state.step); state.step = next;
  window.scrollTo({top:0, behavior:'smooth'});
  render();
  const field = document.querySelector('.q input.fi, .q textarea.fi');
  if(field) field.focus();
}


function accountBit(){
  if(!store.ready) return `<span class="pill">loading…</span>`;
  if(!store.sb) return `<span class="pill" title="No Supabase project configured">this device</span>`;
  if(!store.user) return `<button class="btn" data-act="account">${I.at}Sign in</button>`;
  return `<button class="btn" data-act="account" title="${esc(store.user.email||'')}"><span class="pill live">signed in</span></button>`;
}

/* The editor rebuilds its markup on every structural change, so the caret and
   the scroll position have to be carried across by hand. This does not make the
   rebuild cheap; it makes it invisible. */
function snapshotFocus(){
  const el = document.activeElement;
  const snap = {scroll: window.scrollY};
  if(el && el !== document.body && (el.dataset.block || el.id)){
    snap.block = el.dataset.block; snap.field = el.dataset.field; snap.opt = el.dataset.opt;
    snap.id = el.id;
    try{ snap.start = el.selectionStart; snap.end = el.selectionEnd; }catch(e){}
  }
  return snap;
}
function restoreFocus(snap){
  if(!snap) return;
  if(!state.focus && (snap.block || snap.id)){
    const sel = snap.block
      ? (snap.opt ? `[data-block="${snap.block}"][data-opt="${snap.opt}"]`
                  : `[data-block="${snap.block}"][data-field="${snap.field}"]`)
      : null;
    const el = sel ? document.querySelector(sel) : document.getElementById(snap.id);
    if(el && el !== document.activeElement){
      el.focus();
      if(snap.start != null){ try{ el.setSelectionRange(snap.start, snap.end); }catch(e){} }
    }
  }
  if(Math.abs(window.scrollY - snap.scroll) > 1) window.scrollTo(0, snap.scroll);
}

/* ============================ render: shell ============================ */
function render(){
  const f = form();
  // a link naming a form this visitor cannot see says so, rather than
  // dropping them on a workspace that is not theirs
  if(state.missing && !formById(state.missing)){
    bar.innerHTML = renderBar(); stage.innerHTML = renderMissing();
    layer.querySelectorAll('.panel,.scrim').forEach(n=>n.remove());
    return;
  }
  if(state.view!=='home' && !f && store.ready){ state.view='home'; state.formId=null; }
  const snap = snapshotFocus();
  bar.innerHTML = renderBar();
  stage.innerHTML =
    state.view==='home' ? renderHome() :
    state.view==='build' ? renderBuild() :
    state.view==='fill' ? renderFill() :
    state.view==='responses' ? renderResponses() : '';
  layer.querySelectorAll('.panel,.scrim').forEach(n=>n.remove());
  if(state.panel) renderPanel();
  if(state.view==='build') afterBuild();
  restoreFocus(snap);
}
function renderMissing(){
  return `<div class="wrap"><div class="empty" style="margin-top:var(--sp-8)">
    <strong>This form is not available</strong>
    It may be a draft, or the link may be wrong. If you were sent it, ask whoever
    shared it to publish the form.</div></div>`;
}
function renderBar(){
  const f = form();
  if(state.view==='home' || !f){
    return `<button class="mark" data-act="home" title="Your forms"><i>水</i>Suisei</button><div class="crumb"></div>
      <div class="tools">${accountBit()}</div>`;
  }
  const tabs = `<div class="seg hide-sm">
      <button data-act="tab" data-v="build" aria-selected="${state.view==='build'}">Build</button>
      <button data-act="tab" data-v="responses" aria-selected="${state.view==='responses'}">Responses</button>
    </div>`;
  if(state.view==='fill'){
    return `<a class="mark" href="index.html" title="What is Suisei?"><i>水</i>Suisei</a><div class="crumb"><span class="sep">/</span><span>${esc(f.title)}</span></div>
      <div class="tools"><button class="btn" data-act="exit-fill">${I.back}<span class="hide-sm">Back to editor</span></button></div>`;
  }
  return `<button class="mark" data-act="home" title="Your forms"><i>水</i>Suisei</button>
    <div class="crumb"><span class="sep">/</span>${f.emoji?emojiImg(f.emoji,"crumbicon"):""}<input id="ftitle-bar" value="${esc(f.title)}" data-bind="title" aria-label="Form name"></div>
    ${tabs}
    <div class="tools">
      <span class="pill" id="savestate">${store.saveLabel()}</span>
      ${accountBit()}
      <button class="btn" data-act="customize" title="Customize">${I.paint}<span class="hide-sm">Customize</span></button>
      <button class="btn" data-act="preview">${I.eye}<span class="hide-sm">Preview</span></button>
      <button class="btn primary" data-act="share">${I.share}Share</button>
    </div>`;
}

/* ============================ render: home ============================ */
function renderHome(){

  const cards = list.map(f=>{

        <button class="x" data-act="del-form" data-id="${f.id}">${state.confirmDel===f.id?'Delete?':'Remove'}</button>
      </div>
      <div class="strip"><i style="width:${Math.min(100, n*8)}%;background:${f.theme.accent}"></i></div>
      <div class="meta"><span>${n} response${n===1?'':'s'}</span><span>·</span><span>${qs} question${qs===1?'':'s'}</span>${pages>1?`<span>·</span><span>${pages} pages</span>`:''}</div>
      <div class="row" style="margin-top:2px">
        <button class="btn" style="padding:4px 8px" data-act="open" data-id="${f.id}">Edit</button>

  return `<div class="wrap">
    <div class="lede">
      <div><h1>My workspace</h1><p>Write a form the way you write a document. Every block is a question.</p></div>

    </div>
    ${list.length?`<div class="grid">${cards}</div>`:empty}
    <div class="tpl">
      <span class="btn" style="padding:7px 0;color:var(--faint)">Start from</span>
      <button data-act="new" data-t="contact">${I.at} Contact form</button>
      <button data-act="new" data-t="rsvp">${I.cal} Event RSVP</button>
      <button data-act="new" data-t="feedback">${I.star} Product feedback</button>
      <button data-act="new" data-t="job">${I.file} Job application</button>
    </div>

}

/* ============================ render: builder ============================ */
function renderBuild(){
  const f = form();
  const pages = [];
  let page = 1;
  const body = f.blocks.map((b,i)=>{
    let shell;
    if(b.type==='page'){ page++; shell = blockShell(b, i, `<div class="pagebreak">Page ${page}</div>`); }
    else if(b.type==='divider') shell = blockShell(b, i, `<div class="rule"></div>`);
    else {
      const req = b.required ? `<span class="req" title="Required">*</span>` : '';
      const label = `<div style="display:flex;align-items:flex-start"><textarea class="lbl" rows="1" data-block="${b.id}" data-field="label"
          placeholder="${isInput(b.type)?'Ask a question…':(b.type==='text'?"Write text, or press '/' for a block":'Heading')}">${esc(b.label)}</textarea>${req}</div>`;
      shell = blockShell(b, i, label + (isInput(b.type)?`<div class="field">${fieldPreview(b)}</div>`:''));
    }
    return shell + rules(f).filter(r=>r.when===b.id).map(r=>ruleCard(r,f)).join('');
  }).join('');
  return `<div class="canvasform" data-bg="${f.theme.bg}" data-align="${f.theme.align}" style="${themeVars(f)}">
    <div class="col">
      <button class="formicon" data-act="emoji" title="${f.emoji?'Change the icon':'Add an icon'}">${
        f.emoji ? emojiImg(f.emoji,'') : '<span class="addicon">+ Icon</span>'}</button>
      <textarea class="ftitle" rows="1" data-bind="title" placeholder="Form title">${esc(f.title)}</textarea>
      <div class="blocks" id="blocks">${body}</div>
      <button class="addopt" style="margin-top:14px" data-act="add-block" data-at="${f.blocks.length}">+ Add a block</button>
      ${fields(f).length?`<div class="hfrow"><span class="lg">Hidden fields</span>${fields(f).map(h=>`<code>@${esc(h.name)}</code>`).join('')}<button data-act="share">Edit</button></div>`:''}
    </div>
  </div>`;
}
function blockShell(b, i, inner){
  const sel = state.sel===b.id;
  const t = TYPES[b.type];
  const toolbar = sel ? `<div class="toolbar">
      <button data-act="type-menu" data-id="${b.id}">${I[t.i]}${t.n}</button>
      ${isInput(b.type)?`<div class="div"></div><button data-act="req" data-id="${b.id}" class="${b.required?'on':''}">Required</button>
      <button data-act="add-logic" data-id="${b.id}" title="Add a rule">${I.branch}Logic</button>`:''}
      <div class="div"></div>
      <button data-act="del-block" data-id="${b.id}" title="Delete">${I.trash}</button>
    </div>` : '';
  return `<div class="blk${sel?' sel':''}" data-id="${b.id}" data-type="${b.type}" data-i="${i}">
    ${toolbar}
    <div class="gutter">
      <button data-act="add-block" data-at="${i+1}" title="Insert below">${I.plus}</button>
      <button class="grip" draggable="true" data-id="${b.id}" title="Drag to move">${I.grip}</button>
    </div>
    ${inner}
  </div>`;
}
function shortLabel(b){
  const s = (b.label||'').trim() || TYPES[b.type].n;
  return s.length>30 ? s.slice(0,29)+'…' : s;
}
function ruleCard(r, f){
  const isHid = String(r.when||'').startsWith(HIDDEN_PREFIX);
  const wb = isHid ? null : f.blocks.find(x=>x.id===r.when);
  if(!isHid && !wb) return '';
  const kind = isHid ? 'text' : opKind(wb.type);
  const needsValue = r.op!=='empty' && r.op!=='not_empty';
  const sel = (k, opts) => `<select data-rule="${r.id}" data-k="${k}">${opts}</select>`;
  const val = !needsValue ? '' : (kind==='pick'
    ? sel('value', (wb.options||[]).map(o=>`<option value="${o.id}"${r.value===o.id?' selected':''}>${esc(o.text||'Untitled option')}</option>`).join(''))
    : `<input data-rule="${r.id}" data-k="value" value="${esc(r.value==null?'':r.value)}" placeholder="${kind==='num'?'0':'value'}" style="width:108px">`);
  const pages = pagesOf(f);
  const target = r.do==='jump'
    ? sel('page', pages.map((p,i)=>`<option value="${i}"${Number(r.page)===i?' selected':''}>Page ${i+1}</option>`).join(''))
    : (r.do==='show'||r.do==='hide')
      ? sel('target', f.blocks.filter(x=>x.type!=='page'&&x.id!==r.when).map(x=>`<option value="${x.id}"${r.target===x.id?' selected':''}>${esc(shortLabel(x))}</option>`).join(''))
      : '';
  return `<div class="logic">
    <span class="lg">When</span>
    ${sel('when', `<optgroup label="Questions">${f.blocks.filter(x=>isInput(x.type)).map(q=>`<option value="${q.id}"${q.id===r.when?' selected':''}>${esc(shortLabel(q))}</option>`).join('')}</optgroup>`
      + (fields(f).length?`<optgroup label="Hidden fields">${fields(f).map(h=>`<option value="${HIDDEN_PREFIX}${esc(h.name)}"${r.when===HIDDEN_PREFIX+h.name?' selected':''}>@${esc(h.name)}</option>`).join('')}</optgroup>`:''))}
    ${sel('op', OPS[kind].map(([v,n])=>`<option value="${v}"${r.op===v?' selected':''}>${n}</option>`).join(''))}
    ${val}
    <span class="lg">Then</span>
    ${sel('do', DOS.map(([v,n])=>`<option value="${v}"${r.do===v?' selected':''}>${n}</option>`).join(''))}
    ${target}
    <button class="rm" data-act="del-logic" data-id="${r.id}" title="Remove rule">×</button>
  </div>`;
}
/* The - and + used to sit after the row they resized, so each click moved the
   button out from under the cursor. Here the count is fixed-width and the
   buttons never move. */
function stepper(b, noun){
  return `<div class="stepper"><span class="lg">${noun}</span>
    <button data-act="rate-less" data-id="${b.id}" aria-label="One fewer">−</button>
    <b>${b.max}</b>
    <button data-act="rate-more" data-id="${b.id}" aria-label="One more">+</button></div>`;
}
function fieldPreview(b){
  const t = b.type;
  if(t==='long_text') return `<textarea class="fi" rows="3" data-block="${b.id}" data-field="placeholder" placeholder="Type your answer…">${esc(b.placeholder)}</textarea>`;
  if(t==='choice'||t==='checkboxes'||t==='dropdown'){
    const sq = t==='checkboxes';
    const rows = b.options.map((o,k)=>`<div class="opt${sq?' sq':''}">
        <span class="mk"></span>
        <input value="${esc(o.text)}" placeholder="Option ${k+1}" data-block="${b.id}" data-field="opt" data-opt="${o.id}">
        <span class="k">${KEYS[k]||''}</span>
        <button class="rm" data-act="del-opt" data-id="${b.id}" data-opt="${o.id}" title="Remove">×</button>
      </div>`).join('');
    return `<div class="opts">${rows}<button class="addopt" data-act="add-opt" data-id="${b.id}">+ Add option</button></div>`;
  }
  if(t==='rating') return `<div class="stars">${Array.from({length:b.max},(_,k)=>`<span class="on">${I.star}</span>`).join('')}</div>
      ${stepper(b, 'stars')}`;
  if(t==='scale') return `<div class="scale">${Array.from({length:b.max},(_,k)=>`<span>${k+1}</span>`).join('')}</div>
      ${stepper(b, 'points')}
      <div class="ends"><span class="lg">End labels</span>
        <input value="${esc(b.left)}" data-block="${b.id}" data-field="left" placeholder="low end, or leave empty">
        <input value="${esc(b.right)}" data-block="${b.id}" data-field="right" placeholder="high end, or leave empty"></div>`;
  if(t==='file') return `<div class="drop">Drop a file or click to upload</div>`;
  if(t==='date') return `<input class="fi" type="date" disabled style="max-width:220px">`;
  return `<input class="fi" value="${esc(b.placeholder)}" data-block="${b.id}" data-field="placeholder" placeholder="Placeholder text">`;
}
function afterBuild(){
  document.querySelectorAll('textarea.lbl,.ftitle').forEach(fit);
  if(state.focus){
    const {id, field, opt} = state.focus;
    const sel = opt ? `[data-block="${id}"][data-opt="${opt}"]` : `[data-block="${id}"][data-field="${field}"]`;
    const el = document.querySelector(sel);
    if(el){ el.focus(); const n = el.value.length; try{ el.setSelectionRange(n,n) }catch(e){} }
    state.focus = null;
  }
}
function fit(t){ t.style.height='auto'; t.style.height = t.scrollHeight+'px'; }
/* Zen Kaku's metrics differ from the fallback, so every auto-sized label is
   measured again once the real face has swapped in. */
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{ document.querySelectorAll('textarea.lbl,.ftitle').forEach(fit); });
}

/* ============================ render: fill ============================ */
function renderFill(){
  const f = form();
  const t = f.theme;
  const stepped = (state.runner || t.runner) === 'step';
  const pages = pagesOf(f);
  const steps = stepped ? stepsOf(f) : null;
  const total = stepped ? steps.length : pages.length;
  const at = stepped ? state.step : state.page;
  const toggle = `<button class="runner" data-act="runner">${stepped ? 'Show every question at once' : 'Answer one question at a time'}</button>`;
  const shell = inner => `<div class="canvasform" data-bg="${t.bg}" data-align="${t.align}" data-runner="${stepped?'step':'grid'}" style="${themeVars(f)}">
      ${total>1 && !state.done?`<div class="progress"><i style="width:${Math.round(at/total*100)}%"></i></div>`:''}
      <div class="col">${inner}</div></div><a class="badge" href="index.html">Made with Suisei</a>`;
  if(state.done){
    return shell(`<div class="done"><div class="tick">${I.tick}</div><h2>${esc(pipe(t.thanks, f))}</h2>
      <p>Your response has been recorded.</p>
      <button class="btn ghost" data-act="again">Submit another response</button></div>`);
  }
  const hv = Object.keys(state.hidden||{});
  const peek = ((store.editor || !store.sb) && hv.length)
    ? `<div class="hfrow" style="margin:0 0 22px;padding:0;border:0">${hv.map(k=>`<code>@${esc(k)} = ${esc(state.hidden[k])}</code>`).join('')}<span class="lg">editors only</span></div>` : '';
  const title = `${f.emoji?emojiImg(f.emoji,'formicon-read'):''}<h1 class="ftitle-read">${esc(f.title)}</h1>`;

  if(stepped){
    const cur = steps[Math.min(state.step, steps.length-1)];
    const last = state.step >= steps.length-1;
    return shell(`
      ${state.step===0?title:''}
      ${state.step===0?peek:''}
      ${cur.lead.map(b=>renderQ(b)).join('')}
      ${cur.q?renderQ(cur.q, true):''}
      <div class="nav">
        ${state.hist.length?`<button class="back" data-act="prev">${I.back} Back</button>`:''}
        <button class="submit" data-act="next">${last?esc(t.submit):'OK'} ${I.arrow}</button>
        <span class="counter">${state.step+1} / ${steps.length}</span>
      </div>
      ${toggle}`);
  }

  const first = state.page===0;
  const last = state.page===pages.length-1;
  return shell(`
    ${first?title:''}
    ${peek}
    ${liveBlocks(pages[state.page], f).map(b=>renderQ(b)).join('')}
    <div class="nav">
      ${(!first||state.hist.length)?`<button class="back" data-act="prev">${I.back} Back</button>`:''}
      <button class="submit" data-act="${last?'send':'next'}">${last?esc(t.submit):'Next'} ${I.arrow}</button>
      ${pages.length>1?`<span class="counter">${state.page+1} / ${pages.length}</span>`:''}
    </div>
    ${toggle}`);
}
function renderQ(b, big){
  const f = form();
  const v = state.answers[b.id];
  if(b.type==='h1') return `<h2 class="q-h1">${esc(pipe(b.label,f))}</h2>`;
  if(b.type==='h2') return `<h3 class="q-h2">${esc(pipe(b.label,f))}</h3>`;
  if(b.type==='text') return `<p class="q-text">${esc(pipe(b.label,f))}</p>`;
  if(b.type==='divider') return `<div class="rule"></div>`;
  const bad = state.bad[b.id];
  const head = `<div class="ql${big?' ql-xl':''}">${esc(pipe(b.label,f)||'Untitled question')}${b.required?'<span class="req">*</span>':''}</div>`;
  let ctl = '';
  if(b.type==='long_text') ctl = `<textarea class="fi" rows="3" data-a="${b.id}" placeholder="${esc(b.placeholder)}">${esc(v||'')}</textarea>`;
  else if(b.type==='choice'||b.type==='checkboxes'){
    const multi = b.type==='checkboxes';
    ctl = `<div class="opts">${b.options.map((o,k)=>{
      const on = multi ? (Array.isArray(v)&&v.includes(o.id)) : v===o.id;
      return `<button class="opt${multi?' sq':''}${on?' pick':''}" data-act="pick" data-id="${b.id}" data-opt="${o.id}">
        <span class="mk">${on?I.tick:''}</span><span style="flex:1;min-width:0">${esc(o.text||'Option '+(k+1))}</span><span class="k">${KEYS[k]||''}</span></button>`;
    }).join('')}</div>`;
  }
  else if(b.type==='dropdown') ctl = `<select class="fi" data-a="${b.id}" style="max-width:340px"><option value="">Select…</option>${b.options.map(o=>`<option value="${o.id}"${v===o.id?' selected':''}>${esc(o.text)}</option>`).join('')}</select>`;
  else if(b.type==='rating') ctl = `<div class="stars">${Array.from({length:b.max},(_,k)=>`<button data-act="rate" data-id="${b.id}" data-v="${k+1}" class="${v>=k+1?'on':''}" aria-label="${k+1} of ${b.max}">${I.star}</button>`).join('')}</div>`;
  else if(b.type==='scale') ctl = `<div class="scale">${Array.from({length:b.max},(_,k)=>`<button data-act="rate" data-id="${b.id}" data-v="${k+1}" class="${v===k+1?'on':''}">${k+1}</button>`).join('')}</div>
      ${(b.left||b.right)?`<div class="scale-ends"><span>${esc(b.left)}</span><span>${esc(b.right)}</span></div>`:''}`;
  else if(b.type==='file') ctl = `<label class="drop" style="display:block;cursor:pointer">${v?esc(v):'Drop a file or click to upload'}<input type="file" data-a="${b.id}" hidden></label>`;
  else {
    const types = {number:'number',email:'email',phone:'tel',url:'url',date:'date'};
    ctl = `<input class="fi" type="${types[b.type]||'text'}" data-a="${b.id}" value="${esc(v||'')}" placeholder="${esc(b.placeholder)}"${b.type==='date'?' style="max-width:220px"':''}>`;
  }
  return `<div class="q${bad?' bad':''}" data-q="${b.id}">${head}${ctl}${bad?`<div class="err">${esc(bad)}</div>`:''}</div>`;
}

/* ============================ render: responses ============================ */
function renderResponses(){
  const f = form();
  const rows = (state.rows||[]).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const cols = f.blocks.filter(b=>isInput(b.type));
  if(state.rows===null) return `<div class="wrap"><div class="empty">Loading responses…</div></div>`;
  if(!rows.length) return `<div class="wrap">
    <div class="lede"><div><h1>Responses</h1><p>Nothing yet. Open the form and submit one to see it land here.</p></div>
    <button class="btn ghost" data-act="preview">${I.eye}Open the form</button></div>
    <div class="empty"><strong>No responses yet</strong>Answers show up here the moment someone submits.</div></div>`;
  const last = new Date(rows[0].createdAt);
  const stats = `<div class="stats">
    <div class="stat"><b>${rows.length}</b><span>Responses</span></div>
    <div class="stat"><b>${cols.length}</b><span>Questions</span></div>
    <div class="stat"><b>${fmtShort(last)}</b><span>Latest</span></div>
    <div class="stat"><b>${Math.round(rows.reduce((s,r)=>s+answered(r,cols),0)/rows.length/Math.max(cols.length,1)*100)}%</b><span>Avg completion</span></div>
  </div>`;
  const bds = cols.filter(b=>['choice','checkboxes','dropdown','rating','scale'].includes(b.type)).slice(0,4).map(b=>{
    let items;
    if(b.type==='rating'||b.type==='scale'){
      items = Array.from({length:b.max},(_,k)=>({label:String(k+1), n:rows.filter(r=>r.answers[b.id]===k+1).length}));
    } else {
      items = b.options.map(o=>({label:o.text||'Untitled', n:rows.filter(r=>{const v=r.answers[b.id]; return Array.isArray(v)?v.includes(o.id):v===o.id;}).length}));
    }
    const max = Math.max(1, ...items.map(i=>i.n));
    return `<div class="bd"><h4>${esc(b.label||'Untitled question')}</h4>
      ${items.map(i=>`<div class="r"><span>${esc(i.label)}</span><b>${i.n}</b><div class="track"><i style="width:${Math.round(i.n/max*100)}%;background:${f.theme.accent}"></i></div></div>`).join('')}</div>`;
  }).join('');
  const hcols = fields(f);
  const cell = v => `<td title="${esc(v)}">${esc(v)||'<span style="color:var(--faint)">—</span>'}</td>`;
  const head = `<tr><th>Submitted</th>${cols.map(b=>`<th>${esc(b.label||TYPES[b.type].n)}</th>`).join('')}${hcols.map(h=>`<th>@${esc(h.name)}</th>`).join('')}</tr>`;
  const body = rows.map(r=>`<tr><td class="when">${fmt(new Date(r.createdAt))}${r.local?' <span class="pill">local</span>':''}</td>${cols.map(b=>cell(cellText(b,r))).join('')}${hcols.map(h=>cell((r.hidden||{})[h.name]||'')).join('')}</tr>`).join('');
  return `<div class="wrap">
    <div class="lede"><div><h1>Responses</h1><p>${rows.length} submission${rows.length===1?'':'s'} to “${esc(f.title)}”.</p></div>
      <div class="tools">
        <button class="btn ghost" data-act="copy-csv">${I.copy}Copy CSV</button>
        <button class="btn ghost" data-act="dl-csv">${I.down}Download CSV</button>
      </div></div>
    ${stats}${bds?`<div class="breakdown">${bds}</div>`:''}
    <div class="tablewrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
  </div>`;
}
function answered(r, cols){ return cols.filter(b=>{const v=r.answers[b.id]; return Array.isArray(v)?v.length:(v!==undefined&&v!=='')}).length; }
function cellText(b, r){
  const v = r.answers[b.id];
  if(v===undefined||v===null||v==='') return '';
  if(b.type==='choice'||b.type==='dropdown'){ const o=(b.options||[]).find(o=>o.id===v); return o?o.text:String(v); }
  if(b.type==='checkboxes'){ return (Array.isArray(v)?v:[]).map(id=>{const o=(b.options||[]).find(o=>o.id===id); return o?o.text:id;}).join(', '); }
  if(b.type==='rating') return v+' / '+b.max;
  return String(v);
}
const pad = n => String(n).padStart(2,'0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
function fmtShort(d){
  const mins = Math.round((Date.now()-d.getTime())/60000);
  if(mins<1) return 'just now'; if(mins<60) return mins+'m ago';
  const h = Math.round(mins/60); if(h<24) return h+'h ago';
  return Math.round(h/24)+'d ago';
}
function csv(){
  const f = form(); const cols = f.blocks.filter(b=>isInput(b.type)); const hcols = fields(f);
  const rows = (state.rows||[]).slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const q = s => '"' + String(s==null?'':s).replace(/"/g,'""') + '"';
  return [['Submitted'].concat(cols.map(b=>b.label||TYPES[b.type].n), hcols.map(h=>'@'+h.name)).map(q).join(',')]
    .concat(rows.map(r=>[fmt(new Date(r.createdAt))]
      .concat(cols.map(b=>cellText(b,r)), hcols.map(h=>(r.hidden||{})[h.name]||''))
      .map(q).join(','))).join('\n');
}

/* ============================ slash / type menu ============================ */
function openMenu(kind, opts){
  state.menu = Object.assign({kind, q:'', idx:0}, opts);
  drawMenu();
}
function closeMenu(){ state.menu = null; layer.querySelectorAll('.menu,.menu-scrim').forEach(n=>n.remove()); }
function menuItems(){
  const m = state.menu || {};
  const q = (m.q||'').toLowerCase();
  if(m.kind === 'pipe'){
    const f = form();
    const upto = f.blocks.findIndex(x => x.id === m.blockId);
    return f.blocks.slice(0, upto < 0 ? f.blocks.length : upto)
      .filter(x => isInput(x.type))
      .filter(x => !q || (x.label||'').toLowerCase().includes(q))
      .map(x => ({k:x.id, n:x.label || TYPES[x.type].n, ic:TYPES[x.type].i, grp:'Earlier answers'}));
  }
  // "number" must reach Number before Phone number: exact, then prefix, then
  // anywhere, and registry order inside each tier
  const rank = k => {
    const n = TYPES[k].n.toLowerCase();
    if(n === q || k === q) return 0;
    if(n.startsWith(q) || k.startsWith(q)) return 1;
    return 2;
  };
  const order = Object.keys(TYPES);
  return order
    .filter(k => !q || TYPES[k].n.toLowerCase().includes(q) || k.includes(q))
    .map(k => ({k, n:TYPES[k].n, ic:TYPES[k].i, grp:TYPES[k].g, _r:q?rank(k):0}))
    .sort((a, b) => a._r - b._r || order.indexOf(a.k) - order.indexOf(b.k));
}
function drawMenu(){
  layer.querySelectorAll('.menu,.menu-scrim').forEach(n=>n.remove());
  const m = state.menu; if(!m) return;
  const items = menuItems();
  if(m.idx >= items.length) m.idx = Math.max(0, items.length-1);
  const el = document.createElement('div');
  el.className = 'menu canvasform';
  const mf = form();
  if(mf){ el.setAttribute('data-bg', mf.theme.bg); el.setAttribute('style', themeVars(mf)); }
  const ownBox = m.kind === 'insert';
  let html = ownBox ? `<input class="q" placeholder="Search blocks…" value="${esc(m.q)}" aria-label="Search blocks">` : '';
  let grp = '';
  items.forEach((it,i)=>{
    if(it.grp!==grp){ grp = it.grp; html += `<div class="grp">${grp}</div>`; }
    html += `<button class="it" data-act="pick-type" data-k="${it.k}" aria-selected="${i===m.idx}"><span class="ic">${I[it.ic]}</span>${esc(it.n)}</button>`;
  });
  if(!items.length) html = html + `<div class="none">${m.kind==='pipe'?'No earlier question to reference':'No block matches “'+esc(m.q)+'”'}</div>`;
  el.innerHTML = html;
  // a click that misses the menu closes it instead of reaching the field
  // underneath, which is how a question's text once landed inside an option
  const scrim = document.createElement('div');
  scrim.className = 'menu-scrim';
  layer.appendChild(scrim);
  layer.appendChild(el);

  // The menu is fixed, so it is placed in viewport coordinates throughout. The
  // old code added scrollY to a viewport rect and then clamped the result
  // against the viewport height, which threw the menu far above its trigger
  // on a scrolled page.
  const r = m.rect;
  const h = Math.min(el.offsetHeight || 332, 332);
  const below = window.innerHeight - r.bottom - 8;
  const top = below >= h || below >= r.top - 8 ? r.bottom + 6 : r.top - h - 6;
  el.style.top = Math.round(Math.max(8, Math.min(window.innerHeight - h - 8, top))) + 'px';
  el.style.left = Math.round(Math.max(8, Math.min(window.innerWidth - el.offsetWidth - 8, r.left))) + 'px';
  if(ownBox){ const q = el.querySelector('.q'); if(q){ q.focus(); q.setSelectionRange(q.value.length,q.value.length); } }
  const on = el.querySelector('[aria-selected="true"]'); if(on) on.scrollIntoView({block:'nearest'});
}
function applyPipe(srcId){
  const f = form(), m = state.menu;
  const src = f.blocks.find(x => x.id === srcId);
  const tgt = f.blocks.find(x => x.id === m.blockId);
  closeMenu();
  if(!src || !tgt) return;
  const ref = ensureRef(src, f);
  const cut = tgt.label.lastIndexOf('@');
  tgt.label = (cut < 0 ? tgt.label : tgt.label.slice(0, cut)) + '@' + ref + ' ';
  store.saveForm(f); state.dirtyUntil = Date.now() + 4000;
  state.sel = tgt.id; state.focus = {id:tgt.id, field:'label'};
  render();
}
function applyType(k){
  const f = form();
  const m = state.menu;
  if(m.kind === 'pipe'){ applyPipe(k); return; }
  closeMenu();
  if(m.kind==='type' || m.slash){
    const b = f.blocks.find(x=>x.id===m.blockId);
    const keep = m.slash ? '' : b.label;
    const nb = block(k, keep);
    nb.id = b.id;
    f.blocks[f.blocks.indexOf(b)] = nb;
    state.sel = nb.id; state.focus = {id:nb.id, field:'label'};
  } else {
    const nb = block(k, '');
    f.blocks.splice(m.at, 0, nb);
    state.sel = nb.id; state.focus = {id:nb.id, field:'label'};
  }
  store.saveForm(f); state.dirtyUntil = Date.now()+4000; render();
}

/* ============================ events ============================ */
document.addEventListener('click', e=>{
  // a click on the scrim only dismisses the menu; it must not also reach the
  // editor behind it
  if(e.target.classList && e.target.classList.contains('menu-scrim')){ closeMenu(); return; }
  const a = e.target.closest('[data-act]');
  if(!a){
    if(!e.target.closest('.menu')) closeMenu();
    if(e.target.closest('.logic') || e.target.closest('.panel')) return;
    if(state.view==='build'){
      const blk = e.target.closest('.blk');
      const id = blk ? blk.dataset.id : null;
      if(id!==state.sel){
        state.sel = id;
        const t = e.target;
        if(t.dataset && t.dataset.block) state.focus = {id:t.dataset.block, field:t.dataset.field, opt:t.dataset.opt};
        render();
      }
    }
    return; }
  const act = a.dataset.act, f = form();
  const dirty = ()=>{ state.dirtyUntil = Date.now()+4000; store.saveForm(f); };
  switch(act){
    case 'new': {
      const t = a.dataset.t;
      const nf = t==='blank' ? newForm() : TEMPLATES[t]();
      store.saveForm(nf); go('build', nf.id); break;
    }
    case 'open': go('build', a.dataset.id); break;
    case 'open-fill': go('fill', a.dataset.id); break;
    case 'del-form': {
      const id = a.dataset.id;
      if(state.confirmDel!==id){ state.confirmDel = id; render(); setTimeout(()=>{ if(state.confirmDel===id){ state.confirmDel=null; render(); } }, 6000); }
      else { store.deleteForm(id); state.confirmDel=null; render(); toast('Form removed'); }
      break;
    }
    case 'tab': go(a.dataset.v); break;
    case 'preview': state.panel=null; go('fill', state.formId); break;
    case 'exit-fill': go('build', state.formId); break;
    case 'emoji': state.panel = state.panel==='emoji'?null:'emoji'; state.emojiQ=''; render(); break;
    case 'pick-emoji': { f.emoji = a.dataset.p; state.panel=null; dirty(); render(); break; }
    case 'clear-emoji': { f.emoji = ''; state.panel=null; dirty(); render(); break; }
    case 'home': go('home'); break;
    case 'account': state.panel = state.panel==='account'?null:'account'; render(); break;
    case 'google': {
      a.disabled = true;
      store.signIn().then(r => { if(!r.ok) { toast(r.message); a.disabled = false; } });
      break;
    }
    case 'signout': store.signOut().then(()=>{ state.panel=null; toast('Signed out'); render(); }); break;
    case 'customize': state.panel = state.panel==='customize'?null:'customize'; render(); break;
    case 'share': state.panel = state.panel==='share'?null:'share'; render(); break;
    case 'close-panel': state.panel = null; render(); break;
    case 'th': {
      const k = a.dataset.k; let v = a.dataset.v;
      if(k==='radius') v = Number(v);
      f.theme[k] = v; if(k==='runner') state.runner = null; dirty(); render(); break;
    }
    case 'publish': {
      f.published = !f.published;
      dirty(); render();
      toast(f.published ? 'Published — the link works now' : 'Unpublished — the link stops working');
      break;
    }
    case 'copy-link': {
      const txt = document.getElementById('sharelink').textContent;
      copy(txt); break;
    }
    case 'add-block': openMenu('insert', {at:Number(a.dataset.at), rect:a.getBoundingClientRect()}); break;
    case 'type-menu': openMenu('type', {blockId:a.dataset.id, rect:a.getBoundingClientRect()}); break;
    case 'pick-type': applyType(a.dataset.k); break;
    case 'req': { const b = f.blocks.find(x=>x.id===a.dataset.id); b.required = !b.required; dirty(); render(); break; }
    case 'del-block': { const id = a.dataset.id;
      f.blocks = f.blocks.filter(x=>x.id!==id);
      f.logic = rules(f).filter(r=>r.when!==id && r.target!==id);
      if(!f.blocks.length) f.blocks=[block('short_text','')]; state.sel=null; dirty(); render(); break; }
    case 'add-logic': {
      const b = f.blocks.find(x=>x.id===a.dataset.id);
      const kind = opKind(b.type);
      const after = f.blocks.slice(f.blocks.indexOf(b)+1).find(x=>x.type!=='page')
                 || f.blocks.find(x=>x.type!=='page' && x.id!==b.id);
      const r = {id:uid('r'), when:b.id, op:'is', value: kind==='pick' ? ((b.options||[])[0]||{}).id : '',
                 do:'show', target: after ? after.id : ''};
      const np = pagesOf(f).length, pi = pageOfBlock(f, b.id);
      if(np>1 && pi<np-1){ r.do='jump'; r.page=Math.min(pi+1, np-1); r.target=undefined; }
      rules(f).push(r); state.sel = b.id; dirty(); render(); break;
    }
    case 'del-logic': { f.logic = rules(f).filter(r=>r.id!==a.dataset.id); dirty(); render(); break; }
    case 'add-field': {
      const el = document.getElementById('newfield');
      const name = fieldName(el ? el.value : '');
      if(!name){ if(el) el.focus(); break; }
      if(fields(f).some(h=>h.name===name)){ toast('That field already exists'); break; }
      fields(f).push({id:uid('h'), name});
      if(el) el.value = '';
      dirty(); render();
      const next = document.getElementById('newfield'); if(next) next.focus();
      break;
    }
    case 'del-field': {
      const name = a.dataset.name;
      f.hidden = fields(f).filter(h=>h.name!==name);
      f.logic = rules(f).filter(r=>r.when !== HIDDEN_PREFIX+name);
      if(state.testHidden) delete state.testHidden[name];
      dirty(); render(); break;
    }
    case 'add-opt': { const b = f.blocks.find(x=>x.id===a.dataset.id); const o={id:uid('o'),text:''}; b.options.push(o); state.focus={id:b.id,opt:o.id}; dirty(); render(); break; }
    case 'del-opt': { const b = f.blocks.find(x=>x.id===a.dataset.id); if(b.options.length>1) b.options = b.options.filter(o=>o.id!==a.dataset.opt); dirty(); render(); break; }
    case 'rate-more': { const b = f.blocks.find(x=>x.id===a.dataset.id); b.max = Math.min(b.type==='rating'?10:11, b.max+1); dirty(); render(); break; }
    case 'rate-less': { const b = f.blocks.find(x=>x.id===a.dataset.id); b.max = Math.max(2, b.max-1); dirty(); render(); break; }
    /* fill */
    case 'pick': {
      const b = f.blocks.find(x=>x.id===a.dataset.id), o = a.dataset.opt;
      if(b.type==='checkboxes'){ const cur = Array.isArray(state.answers[b.id])?state.answers[b.id].slice():[];
        const i = cur.indexOf(o); i>=0?cur.splice(i,1):cur.push(o); state.answers[b.id]=cur; }
      else state.answers[b.id] = state.answers[b.id]===o ? undefined : o;
      delete state.bad[b.id]; render(); break;
    }
    case 'rate': { state.answers[a.dataset.id] = Number(a.dataset.v); delete state.bad[a.dataset.id]; render(); break; }
    case 'next': if(f.theme.runner==='step'){ advanceStep(); } else if(validate()) advance(); else render(); break;
    case 'prev': {
      const back = state.hist.length ? state.hist.pop() : null;
      if(f.theme.runner==='step') state.step = back===null ? Math.max(0,state.step-1) : back;
      else state.page = back===null ? Math.max(0,state.page-1) : back;
      state.bad={}; render(); break;
    }
    case 'send': {
      if(!validate()){ render(); break; }
      const j = jumpFrom(pagesOf(f)[state.page], f, state.answers);
      if(j && j.do==='jump' && Number(j.page)!==state.page) advance(); else send();
      break;
    }
    case 'again': state.page=0; state.step=0; state.hist=[]; state.answers={}; state.bad={}; state.done=false; render(); break;
    // a reader asking for every question at once is choosing a view, not
    // editing the form: it must not save, least of all on someone else's copy
    case 'runner': { state.runner = (state.runner||f.theme.runner)==='step'?'grid':'step'; state.page=0; state.step=0; state.hist=[]; state.bad={}; render(); break; }
    /* responses */
    case 'copy-csv': copy(csv()); break;
    case 'dl-csv': dlCsv(); break;
  }
});

function copy(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast('Copied')).catch(()=>selectFallback(txt));
  } else selectFallback(txt);
}
function selectFallback(txt){
  const ta = document.createElement('textarea'); ta.value = txt;
  ta.style.cssText = 'position:fixed;left:-9999px'; document.body.appendChild(ta); ta.select();
  toast('Select and copy — the clipboard is blocked here'); setTimeout(()=>ta.remove(), 8000);
}
function dlCsv(){
  const text = csv();
  const name = ((form().title || 'responses').replace(/[^\w฀-๿\- ]+/g,'').trim() || 'responses') + '.csv';
  try{
    // the BOM is what makes Excel read a UTF-8 CSV as UTF-8; without it Thai
    // answers open as mojibake, which is the whole point of exporting
    const url = URL.createObjectURL(new Blob(['﻿' + text], {type:'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('Downloaded ' + name);
  }catch(e){ copy(text); }
}

/* text binding (no re-render, so the caret stays put) */
document.addEventListener('input', e=>{
  const t = e.target, f = form();
  if(t.dataset.bind==='title' && f){
    f.title = t.value; store.saveForm(f); state.dirtyUntil = Date.now()+4000;
    if(t.classList.contains('ftitle')){ fit(t); const b = document.getElementById('ftitle-bar'); if(b) b.value = t.value; }
    return;
  }
  if(t.dataset.th && f){ f.theme[t.dataset.th] = t.value; store.saveForm(f); state.dirtyUntil = Date.now()+4000; return; }
  if(t.id === 'emoji-q'){
    state.emojiQ = t.value;
    const g = document.getElementById('emoji-grid');
    if(g) g.innerHTML = emojiGrid();
    return;
  }
  if(t.dataset.hf !== undefined && f){
    state.testHidden = state.testHidden || {};
    state.testHidden[t.dataset.hf] = t.value;
    const link = document.getElementById('sharelink');
    if(link) link.textContent = linkFor(f, state.testHidden);
    return;
  }
  if(t.dataset.rule && t.dataset.k==='value' && f){
    const r = rules(f).find(x=>x.id===t.dataset.rule);
    if(r){ r.value = t.value; store.saveForm(f); state.dirtyUntil = Date.now()+4000; }
    return;
  }
  if(t.classList.contains('q') && state.menu){ state.menu.q = t.value; state.menu.idx = 0; drawMenu(); return; }
  if(t.dataset.block && f){
    const b = f.blocks.find(x=>x.id===t.dataset.block); if(!b) return;
    if(t.dataset.field==='label'){
      if(t.value==='/' && !state.menu){ openMenu('slash', {at:f.blocks.indexOf(b)+1, blockId:b.id, slash:true, rect:t.getBoundingClientRect()}); }
      else if(state.menu && state.menu.slash && state.menu.blockId===b.id){
        if(t.value[0] !== '/'){ closeMenu(); } else { state.menu.q = t.value.slice(1); state.menu.idx = 0; drawMenu(); }
      }
      else {
        const upto = t.value.slice(0, t.selectionStart == null ? t.value.length : t.selectionStart);
        if(!state.menu && /(^|\s)@$/.test(upto)){
          openMenu('pipe', {blockId:b.id, rect:t.getBoundingClientRect()});
        } else if(state.menu && state.menu.kind === 'pipe'){
          const m2 = /(?:^|\s)@([^\s]*)$/.exec(upto);
          if(!m2) closeMenu(); else { state.menu.q = m2[1]; state.menu.idx = 0; drawMenu(); }
        }
      }
      b.label = t.value; fit(t);
    }
    else if(t.dataset.field==='opt'){ const o = b.options.find(o=>o.id===t.dataset.opt); if(o) o.text = t.value; }
    else b[t.dataset.field] = t.value;
    store.saveForm(f); state.dirtyUntil = Date.now()+4000;
    return;
  }
  if(t.dataset.a!==undefined && state.view==='fill'){
    const id = t.dataset.a;
    state.answers[id] = t.type==='file' ? (t.files[0]?t.files[0].name:'') : t.value;
    delete state.bad[id];
    if(t.type==='file'){ render(); }
  }
});
document.addEventListener('change', e=>{
  const t = e.target, f = form();
  if(t.dataset.rule && f){
    const r = rules(f).find(x=>x.id===t.dataset.rule); if(!r) return;
    const k = t.dataset.k;
    if(k==='when'){
      r.when = t.value;
      const nb = f.blocks.find(x=>x.id===r.when);
      r.op = 'is'; r.value = nb && opKind(nb.type)==='pick' ? ((nb.options||[])[0]||{}).id : '';
    } else if(k==='do'){
      r.do = t.value;
      if(r.do==='jump') r.page = Math.min(pageOfBlock(f, r.when)+1, pagesOf(f).length-1);
      else if(r.do==='show'||r.do==='hide'){
        if(!r.target){ const after = f.blocks.find(x=>x.type!=='page' && x.id!==r.when); r.target = after?after.id:''; }
      }
    } else if(k==='page') r.page = Number(t.value);
    else r[k] = t.value;
    state.dirtyUntil = Date.now()+4000; store.saveForm(f); render(); return;
  }
  if(t.dataset.a!==undefined && state.view==='fill' && (t.tagName==='SELECT'||t.type==='file')){
    state.answers[t.dataset.a] = t.type==='file' ? (t.files[0]?t.files[0].name:'') : t.value;
    delete state.bad[t.dataset.a];
    if(t.type==='file') render();
  }
});

/* keyboard: the editor's spine */
document.addEventListener('keydown', e=>{
  const f = form();
  if(e.target.id==='newfield' && e.key==='Enter'){
    e.preventDefault();
    const btn = document.querySelector('[data-act="add-field"]');
    if(btn) btn.click();
    return;
  }
  if(state.menu){
    const items = menuItems();
    if(e.key==='ArrowDown'){ e.preventDefault(); state.menu.idx = Math.min(items.length-1, state.menu.idx+1); drawMenu(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); state.menu.idx = Math.max(0, state.menu.idx-1); drawMenu(); return; }
    // applyType takes the key, not the descriptor the list is built from;
    // the click path passes dataset.k, which is why the mouse worked and Enter did not
    if(e.key==='Enter'){ e.preventDefault(); const pick = items[state.menu.idx]; if(pick) applyType(pick.k); return; }
    if(e.key==='Escape'){ e.preventDefault(); const m=state.menu; closeMenu();
      if(m.slash){ const b = f.blocks.find(x=>x.id===m.blockId); if(b){ b.label=''; state.focus={id:b.id,field:'label'}; render(); } }
      return; }
    if(e.key.length===1 && state.menu.kind==='type'){ state.menu.q += e.key; state.menu.idx=0; drawMenu(); e.preventDefault(); return; }
    if(e.key==='Backspace' && state.menu.kind==='type'){ state.menu.q = state.menu.q.slice(0,-1); drawMenu(); e.preventDefault(); return; }
  }
  if(state.view==='build' && f){
    const t = e.target;
    if(t.dataset && t.dataset.field==='label'){
      const b = f.blocks.find(x=>x.id===t.dataset.block); const i = f.blocks.indexOf(b);
      if(e.key==='Enter' && !e.shiftKey){
        e.preventDefault();
        const nb = block('text','');
        f.blocks.splice(i+1, 0, nb); state.sel = nb.id; state.focus = {id:nb.id, field:'label'};
        store.saveForm(f); state.dirtyUntil = Date.now()+4000; render(); return;
      }
      if(e.key==='Backspace' && t.value==='' && f.blocks.length>1){
        e.preventDefault();
        f.blocks.splice(i,1);
        const prev = f.blocks[Math.max(0,i-1)];
        state.sel = prev.id; state.focus = {id:prev.id, field:'label'};
        store.saveForm(f); state.dirtyUntil = Date.now()+4000; render(); return;
      }
      if(e.key==='ArrowUp' && t.selectionStart===0 && i>0){ e.preventDefault(); state.sel=f.blocks[i-1].id; state.focus={id:f.blocks[i-1].id,field:'label'}; render(); return; }
      if(e.key==='ArrowDown' && t.selectionStart===t.value.length && i<f.blocks.length-1){ e.preventDefault(); state.sel=f.blocks[i+1].id; state.focus={id:f.blocks[i+1].id,field:'label'}; render(); return; }
    }
    if(t.dataset && t.dataset.field==='opt'){
      const b = f.blocks.find(x=>x.id===t.dataset.block);
      const oi = b.options.findIndex(o=>o.id===t.dataset.opt);
      if(e.key==='Enter'){ e.preventDefault(); const o={id:uid('o'),text:''}; b.options.splice(oi+1,0,o); state.focus={id:b.id,opt:o.id}; store.saveForm(f); state.dirtyUntil=Date.now()+4000; render(); return; }
      if(e.key==='Backspace' && t.value==='' && b.options.length>1){ e.preventDefault(); b.options.splice(oi,1);
        const p = b.options[Math.max(0,oi-1)]; state.focus={id:b.id,opt:p.id}; store.saveForm(f); state.dirtyUntil=Date.now()+4000; render(); return; }
    }
    if(e.key==='Escape'){ state.sel=null; render(); }
  }
  if(state.view==='fill' && f && !state.done){
    const tag = (e.target.tagName||'').toLowerCase();
    // Enter is how you answer a one-question runner, so it has to work from
    // inside the field. A textarea keeps it for newlines.
    if(e.key==='Enter' && !e.shiftKey && tag!=='textarea' && tag!=='button'){
      e.preventDefault();
      if(f.theme.runner==='step'){ advanceStep(); return; }
      const pg = pagesOf(f);
      if(!validate()){ render(); return; }
      if(state.page===pg.length-1){
        const j = jumpFrom(pg[state.page], f, state.answers);
        if(j && j.do==='jump' && Number(j.page)!==state.page) advance(); else send();
      } else advance();
      return;
    }
    if(tag==='input'||tag==='textarea'||tag==='select') return;
    const k = e.key.toUpperCase();
    if(KEYS.includes(k) && k.length===1){
      const page = f.theme.runner==='step'
        ? (function(){ const st = stepsOf(f)[state.step]; return st && st.q ? [st.q] : []; })()
        : liveBlocks(pagesOf(f)[state.page], f);
      const q = page.find(b=>b.type==='choice'||b.type==='checkboxes');
      if(q){ const idx = KEYS.indexOf(k); const o = q.options[idx];
        if(o){ e.preventDefault();
          if(q.type==='checkboxes'){ const cur = Array.isArray(state.answers[q.id])?state.answers[q.id].slice():[]; const i2=cur.indexOf(o.id); i2>=0?cur.splice(i2,1):cur.push(o.id); state.answers[q.id]=cur; }
          else state.answers[q.id] = o.id;
          delete state.bad[q.id]; render(); } }
    }

  }
});

/* drag to reorder */
let dragId = null;
document.addEventListener('dragstart', e=>{
  const g = e.target.closest('.grip'); if(!g) return;
  dragId = g.dataset.id; e.dataTransfer.effectAllowed='move';
  try{ e.dataTransfer.setData('text/plain', dragId) }catch(err){}
});
document.addEventListener('dragover', e=>{
  if(!dragId) return;
  const blk = e.target.closest('.blk'); if(!blk) return;
  e.preventDefault();
  document.querySelectorAll('.blk').forEach(n=>n.classList.remove('drop-before','drop-after'));
  const r = blk.getBoundingClientRect();
  blk.classList.add(e.clientY < r.top + r.height/2 ? 'drop-before' : 'drop-after');
});
document.addEventListener('drop', e=>{
  if(!dragId) return;
  const blk = e.target.closest('.blk'); const f = form();
  document.querySelectorAll('.blk').forEach(n=>n.classList.remove('drop-before','drop-after'));
  if(blk && f){
    e.preventDefault();
    const from = f.blocks.findIndex(b=>b.id===dragId);
    const r = blk.getBoundingClientRect();
    let to = f.blocks.findIndex(b=>b.id===blk.dataset.id);
    if(e.clientY >= r.top + r.height/2) to++;
    const [moved] = f.blocks.splice(from,1);
    if(from < to) to--;
    f.blocks.splice(to, 0, moved);
    store.saveForm(f); state.dirtyUntil = Date.now()+4000; render();
  }
  dragId = null;
});
document.addEventListener('dragend', ()=>{ dragId=null; document.querySelectorAll('.blk').forEach(n=>n.classList.remove('drop-before','drop-after')); });

/* fill: validation + submit */
function advance(){
  const f = form(), pages = pagesOf(f);
  const jump = jumpFrom(pages[state.page], f, state.answers);
  if(jump && jump.do==='submit'){ send(); return; }
  state.hist.push(state.page);
  let next = jump ? Math.max(0, Math.min(pages.length-1, Number(jump.page)||0)) : state.page+1;
  while(next < pages.length-1 && !liveBlocks(pages[next], f).length) next++;
  state.page = Math.min(next, pages.length-1);
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}
function validate(){
  const f = form(); const page = f.theme.runner==='step'
        ? (function(){ const st = stepsOf(f)[state.step]; return st && st.q ? [st.q] : []; })()
        : liveBlocks(pagesOf(f)[state.page], f);
  state.bad = {};
  page.forEach(b=>{
    if(!isInput(b.type) || !b.required) return;
    const v = state.answers[b.id];
    const empty = v===undefined || v===null || v==='' || (Array.isArray(v) && !v.length);
    if(empty) state.bad[b.id] = 'This question needs an answer.';
    else if(b.type==='email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) state.bad[b.id] = 'Check the email address.';
  });
  const first = Object.keys(state.bad)[0];
  if(first) setTimeout(()=>{ const el = document.querySelector(`[data-q="${first}"]`); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); }, 0);
  return !first;
}
async function send(){
  if(!validate()){ render(); return; }
  const f = form();
  const kept = {};
  f.blocks.forEach(b=>{
    if(!isInput(b.type)) return;
    const v = state.answers[b.id];
    if(v===undefined || v===null || v==='' || (Array.isArray(v)&&!v.length)) return;
    if(visible(b, f, state.answers)) kept[b.id] = v;
  });
  const rec = {id:uid('s'), formId:f.id, createdAt:Date.now(), answers:JSON.parse(JSON.stringify(kept)),
    hidden:JSON.parse(JSON.stringify(state.hidden||{}))};
  state.done = true; render();
  const res = await store.submit(rec);
  if(!res.ok) toast('Saved on this device — this view cannot write to the shared store');
  else if(res.offline) toast('Saved on this device');
}

/* hash routing: #form-<id> opens the form itself */
function fromHash(){
  const token = readLink().token;
  if(token.startsWith('form-')){
    const id = token.slice(5);
    const f = formById(id);
    if(f){
      state.formId = id; state.view='fill'; state.page=0; state.step=0; state.hist=[];
      state.answers={}; state.bad={}; state.done=false;
      state.hidden = hiddenValues(f);
      return true;
    }
  }
  return false;
}
window.addEventListener('hashchange', ()=>{ if(fromHash()) render(); });
window.addEventListener('resize', ()=>{ if(state.menu) closeMenu(); });

/* boot */
const original = store.boot.bind(store);
store.boot = async function(){
  await original();
  if(fromHash()) render();
};
if(bar && stage) store.boot();
</script>
